<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工安智瞳 · 登录工作台</title><link rel="preload" as="image" href="assets/login-blackgold-reference.png"><link rel="stylesheet" href="login-blackgold.css?v=30"><script src="config.js"></script><link rel="stylesheet" href="workspace-refinement.css?v=34"><link rel="stylesheet" href="brand-system.css?v=34"></head>
<body><main class="login-stage" aria-label="工安智瞳工业安全协同工作台">
<img class="login-art" src="assets/login-blackgold-reference.png" alt="工安智瞳，用数据守护每一处作业现场。A、B工厂夜景与黑金机械登录面板。" width="1672" height="941"><h1 class="sr-only">欢迎登录工安智瞳</h1>
<form id="entry-login" aria-label="登录工作台"><label class="sr-only" for="entry-username">账号</label><input id="entry-username" placeholder="输入账号" autocomplete="username" required maxlength="80"><label class="sr-only" for="entry-password">密码</label><input id="entry-password" placeholder="输入密码" type="password" autocomplete="current-password" required maxlength="256"><button id="entry-password-toggle" type="button" aria-label="显示密码" aria-pressed="false"><span class="sr-only">显示密码</span></button><button id="entry-submit" type="submit"><span class="sr-only">登录工作台</span></button></form>
<button id="entry-fill-demo" type="button"><span class="sr-only">填入演示员账号</span></button><p id="entry-status" role="status" aria-live="polite"></p>
<details class="account-options"><summary>账号选项</summary><div class="options-panel"><p id="login-project">连接项目…</p><label class="official-option"><input id="entry-official" type="checkbox">使用正式项目账号</label><details id="entry-demo" hidden><summary>其他演示岗位</summary><div id="entry-roles"></div><button id="entry-guest" type="button">体验演示 · 只读账号</button><button id="entry-new" type="button">新建另一演示空间</button></details><p id="entry-storage"></p></div></details>
</main><script type="module" src="login.mjs?v=33"></script><script type="module" src="brand-system.mjs?v=36"></script></body></html>
